name: Release

# 打 tag（v*）或手动触发时，在云端构建便携版并发布到 Releases。
# 这样本机网络不好、附件传不上去也不影响：构建与上传都在 GitHub 的机器上完成。
#
# 用法（本地只需要推一个 tag）：
#   git tag -a v0.9.0 -m "..." && git push origin v0.9.0
# 或在网页上 Actions → Release → Run workflow 填标签手动触发。
#
# 注意：删掉再重推同名 tag 时，GitHub 会把原来的 Release 转成草稿；
# 草稿既不在公开列表里、也查不到 tag，所以这里显式处理草稿状态。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v0.9.0'
        required: true
        default: 'v0.9.0'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布便携版
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund || npm install --no-audit --no-fund --omit=optional

      - name: 运行测试
        run: node tools/ci-run-tests.cjs

      - name: 构建便携版（自动剥离 Valve SDK）
        run: node tools/prepare-portable.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 检查产物
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Recurse -File -Filter '*.zip' |
            ForEach-Object { Write-Host "$($_.FullName)  $([math]::Round($_.Length/1MB,2)) MB" }

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $title = "Stronghold Link $tag"

          $zip = Get-ChildItem -Path . -Recurse -File -Filter 'Stronghold-Link-*-portable-*.zip' |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) {
            Write-Host '::error title=找不到构建产物::仓库内没有 Stronghold-Link-*-portable-*.zip'
            exit 1
          }
          Write-Host "标签: $tag"
          Write-Host "附件: $($zip.FullName)  ($([math]::Round($zip.Length/1MB,2)) MB)"

          # 现有 Release（含草稿；草稿不在 /releases/tags 接口里）
          $list = gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json
          $list | ForEach-Object { Write-Host "  现有 Release: $($_.tagName) draft=$($_.isDraft)" }
          $mine = $list | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1

          if ($mine) {
            Write-Host "已存在 Release（draft=$($mine.isDraft)），更新说明并确保为已发布"
            gh release edit $tag --title $title --notes-file CHANGELOG.md --draft=false
            if ($LASTEXITCODE -ne 0) {
              Write-Host '::error title=Release 更新失败::gh release edit 返回非零，检查权限'
              exit 1
            }
          } else {
            Write-Host "没有 $tag 的 Release，创建并发布"
            gh release create $tag --title $title --notes-file CHANGELOG.md --verify-tag
            if ($LASTEXITCODE -ne 0) {
              Write-Host '::warning title=verify-tag 失败::改用不带 --verify-tag 的方式重试'
              gh release create $tag --title $title --notes-file CHANGELOG.md
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host '::error title=Release 创建失败::检查 permissions: contents: write 与标签是否存在'
              exit 1
            }
          }

          gh release upload $tag $zip.FullName --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error title=附件上传失败::gh release upload 返回非零'
            exit 1
          }

          $info = gh release view $tag --json url,isDraft,assets | ConvertFrom-Json
          $assets = ($info.assets | ForEach-Object { "$($_.name) $([math]::Round($_.size/1MB,2))MB" }) -join ', '
          Write-Host "草稿: $($info.isDraft)"
          Write-Host "附件: $assets"
          Write-Host "地址: $($info.url)"
          Write-Host "::notice title=Release 状态::草稿=$($info.isDraft) | 附件=$assets | $($info.url)"
          if ($info.isDraft) {
            Write-Host '::error title=Release 仍是草稿::需要手动 Publish'
            exit 1
          }

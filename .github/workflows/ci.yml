name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（${{ matrix.os }} / Node ${{ matrix.node }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # steamworks-ffi-node 是可选依赖（Steam 隧道用）；它装不上时其余测试仍应通过
      - name: 安装依赖
        run: npm install --no-audit --no-fund || npm install --no-audit --no-fund --omit=optional

      - name: 环境信息
        run: |
          node -v
          node -e "try{console.log('electron', require('electron/package.json').version)}catch(e){console.log('electron 未安装:', e.code)}"
          node -e "try{require.resolve('steamworks-ffi-node');console.log('steam 绑定: 已安装')}catch(e){console.log('steam 绑定: 未安装（可选依赖）')}"

      - name: 运行测试
        run: node tools/ci-run-tests.cjs

      - name: 上报测试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.node }}
          path: |
            test-out/
            *.log
          if-no-files-found: ignore
